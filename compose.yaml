services:
  ovida:
    image: ovida
    build:
      context: .
      dockerfile: ./Dockerfile
    environment:
      NODE_ENV: production
    ports:
      - 3000:3000

  gentle:
    image: lowerquality/gentle:latest
    container_name: ovida-gentle
    restart: unless-stopped
    ports:
      - 8765:8765
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection((\"localhost\", 8765), 5).close()"]
      interval: 30s
      timeout: 10s
      retries: 5

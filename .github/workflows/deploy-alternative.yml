name: Deploy Ovida Web (Alternative Method)

on:
  # This workflow is disabled by default - only run manually
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      NODE_VERSION: '20'
      WEB_DIR: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.6

      - name: Install dependencies (root)
        run: pnpm install --frozen-lockfile

      - name: Build @ovida/web
        run: pnpm --filter @ovida/web build

      - name: Verify build output
        run: |
          echo "Checking build output..."
          ls -la ${{ env.WEB_DIR }}/out/
          echo "File count: $(find ${{ env.WEB_DIR }}/out -type f | wc -l)"

      - name: Validate deployment configuration
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          REMOTE_PATH: ${{ vars.REMOTE_PATH }}
        run: |
          set -euo pipefail
          missing=()

          if [ -z "${SSH_HOST}" ]; then
            missing+=("SSH_HOST")
          fi
          if [ -z "${SSH_USER}" ]; then
            missing+=("SSH_USER")
          fi
          if [ -z "${REMOTE_PATH}" ]; then
            missing+=("REMOTE_PATH")
          fi
          if [ -z "${SSH_KEY}" ]; then
            missing+=("SSH_KEY (password auth is disabled or rejected by the deploy host)")
          fi

          if [ -n "${SSH_PASSWORD}" ]; then
            echo "⚠️ SSH_PASSWORD is ignored for deploys. The deploy host rejected password authentication; set SSH_KEY to a private key that is authorized on the host."
          fi

          if [ ${#missing[@]} -ne 0 ]; then
            printf '❌ Missing deployment configuration: %s\n' "${missing[*]}"
            exit 1
          fi

          echo "✅ Deployment configuration looks good."

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            # Create backup of current deployment
            if [ -d "${{ vars.REMOTE_PATH }}" ]; then
              mv "${{ vars.REMOTE_PATH }}" "${{ vars.REMOTE_PATH }}.backup.$(date +%Y%m%d_%H%M%S)"
            fi
            # Create target directory
            mkdir -p "${{ vars.REMOTE_PATH }}"

      - name: Upload files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          source: "${{ env.WEB_DIR }}/out/*"
          target: ${{ vars.REMOTE_PATH }}
          strip_components: 3

      - name: Set proper permissions
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            # Set proper permissions for web files
            find "${{ vars.REMOTE_PATH }}" -type f -exec chmod 644 {} \;
            find "${{ vars.REMOTE_PATH }}" -type d -exec chmod 755 {} \;
            echo "Deployment completed successfully!"
            echo "Files deployed to: ${{ vars.REMOTE_PATH }}"
            ls -la "${{ vars.REMOTE_PATH }}"
name: Deploy Ovida Web (Static → DreamHost)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      NODE_VERSION: '20'
      WEB_DIR: apps/web
      REMOTE_PATH: ${{ vars.REMOTE_PATH }}
      # Static build environment variables (if needed)
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.6

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-v2-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-v2-

      - name: Install dependencies (root)
        run: pnpm install --frozen-lockfile
        env:
          NODE_ENV: development

      - name: Verify TypeScript dependencies
        run: |
          echo "Checking if @types/react is installed..."
          cd apps/web
          if [ -d "node_modules/@types/react" ]; then
            echo "✓ @types/react is installed"
          else
            echo "✗ @types/react is NOT installed, installing now..."
            pnpm install
          fi
          cd ../..

      - name: Build @ovida/web
        run: pnpm --filter @ovida/web build
        env:
          NODE_ENV: production

      - name: Verify build output
        run: |
          echo "Checking build output..."
          if [ ! -d "${{ env.WEB_DIR }}/out" ]; then
            echo "Error: Build output directory not found!"
            echo "Expected: ${{ env.WEB_DIR }}/out"
            echo "Contents of ${{ env.WEB_DIR }}:"
            ls -la ${{ env.WEB_DIR }}/
            exit 1
          fi
          
          echo "Build output directory found:"
          ls -la ${{ env.WEB_DIR }}/out/
          
          file_count=$(find ${{ env.WEB_DIR }}/out -type f | wc -l)
          echo "Total files to deploy: $file_count"
          
          if [ "$file_count" -eq 0 ]; then
            echo "Error: No files found in build output!"
            exit 1
          fi
          
          echo "Build verification complete ✅"

      - name: Upload via SFTP (password)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || '22' }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          sftp_only: true
          local_path: '${{ env.WEB_DIR }}/out/'
          remote_path: ${{ vars.REMOTE_PATH }}
          delete_remote_files: true
          rsyncArgs: '--exclude=.git* --exclude=.github/** --exclude=node_modules/** --exclude=.DS_Store --exclude=.next/cache/**'

      - name: Deployment Summary
        if: success()
        run: |
          echo "🚀 Deployment completed successfully!"
          echo "📁 Files deployed to: ${{ vars.REMOTE_PATH }}"
          echo "🌐 Your site should be available at: https://ovida.1976.cloud"
          echo "⏰ Deployment completed at: $(date)"
